name: Tests E2E React

on:
  push:
    paths:
      - 'exercices-html/library-react/**'
      - '.github/workflows/react-e2e.yml'
  pull_request:
    paths:
      - 'exercices-html/library-react/**'
      - '.github/workflows/react-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: exercices-html/library-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Vérifier le build
        run: npm run build
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Exécuter les tests E2E
        run: npm run test:e2e
      - name: Enregistrer les rapports si échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            exercices-html/library-react/playwright-report
            exercices-html/library-react/test-results
          retention-days: 7
