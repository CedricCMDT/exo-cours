name: AFTERHOURS — qualité et E2E
on:
  push:
    paths:
      - 'exercices-html/afterhours/**'
      - '.github/workflows/afterhours-ci.yml'
  pull_request:
    paths:
      - 'exercices-html/afterhours/**'
      - '.github/workflows/afterhours-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: exercices-html/afterhours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: afterhours-playwright-report
          path: exercices-html/afterhours/test-results
          retention-days: 7
